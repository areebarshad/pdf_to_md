[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-md"
version = "0.3.0"
description = "PDF to Markdown converter with LaTeX math, tables, figures, and OCR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pymupdf>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pdf-to-md = "pdf_to_md.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_to_md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
